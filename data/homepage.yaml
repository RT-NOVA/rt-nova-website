pillars_intro:
  kicker: Development, competition, and coaching.
  title: Program Focus
  text: Baseball built around player development, competitive preparation, team culture, and a better experience for families.

pillars:
  - title: Player Development
    text: Skill work, baseball IQ, confidence, and accountability.
    image: /images/program-media/hank-first-base-pick.jpeg
    image_position: center center
    url: /about/
    link_label: Learn About Development
  - title: Competitive Teams
    text: Age-level teams built around growth and meaningful competition.
    image: /images/program-media/main-love-the-game-1600x1200-crop.jpg
    image_position: center center
    url: /teams/
    link_label: Explore Teams
  - title: Professional Coaching
    text: Clear instruction, organized practices, and development standards.
    image: /images/program-media/13u-coach-talk.jpg
    image_position: 85% center
    url: /coaches/
    link_label: Meet the Coaches

pathway:
  title: Player Development Pathway
  text: An age-appropriate progression from foundation skills to advanced competition.
  stages:
    - age: 10U–11U
      title: Build the Foundation
      text: Fundamentals, athleticism, confidence, and strong habits.
    - age: 12U–13U
      title: Develop the Complete Player
      text: Baseball IQ, consistency, and readiness for middle-school competition.
    - age: 14U–15U
      title: Compete with Purpose
      text: Sharpen execution, physical preparation, and readiness for High-school baseball.
    - age: 16U–18U
      title: Perform at the Next Level
      text: Compete at varsity pace, lead, and prepare for future playing opportunities.
  link:
    label: Explore Current & Upcoming Teams
    url: /teams/

why:
  kicker: Why Rawlings Tigers NOVA?
  title: Local Roots. National Standards.
  intro: We focus on better practices, smarter game preparation, accountable teammates, clear communication, and a travel baseball experience families can understand.
  local:
    enabled: true
    callouts:
      - title: NoVA roots
        text: Serving Woodbridge, Dumfries, Montclair, Dale City, Stafford, Manassas, Fairfax, Prince William County, and surrounding communities.
      - title: Real training locations
        text: Outdoor work centers on Woodbridge-area fields, with winter training at D-BAT Manassas, Metro Baseball Facility, and Veterans Community Center.
    link:
      label: View Training Locations
      url: /training-locations/
  image:
    enabled: false
    #src: /images/program-media/main-love-the-game-1600x1200-full-photo.jpg
    src: /images/program-media/main-love-the-game-1600x1200-crop.jpg
    alt: Rawlings Tigers NOVA players together after a team moment.
    position: center center
    #label: NOVA Baseball Family
    #caption: Real players, real teams, and a program built around the day-to-day experience.

