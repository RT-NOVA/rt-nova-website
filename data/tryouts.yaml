title: Evaluations & Tryouts
season: Fall 2026 Tryouts
intro: Rawlings Tigers NOVA offers competitive travel baseball tryouts for rising
  10U, 12U, 13U, and 14U players in Northern Virginia.
registration_url: /become-a-tiger/
quick_facts:
- label: Ages
  value: Rising 10U, 12U–14U
- label: Format
  value: Open Evaluations
- label: Private
  value: Available by Request
- label: Focus
  value: Development + Fit
evaluation_areas:
- title: Throwing
  text: Arm action, accuracy, carry, throwing mechanics, and ability to make routine
    baseball throws.
- title: Fielding
  text: Footwork, glove work, body control, first-step reads, and position-specific
    fundamentals.
- title: Hitting
  text: Swing mechanics, contact quality, approach, adjustability, and competitive
    at-bats.
- title: Speed
  text: Athletic movement, baserunning instincts, effort, acceleration, and game-speed
    actions.
- title: Game IQ
  text: Situational awareness, communication, decision-making, coachability, and team-first
    habits.
- title: Attitude
  text: Players who are eager to improve, compete with energy, support their teammates,
    and are prepared to play at a high level.
