faq:
- question: How do I register?
  answer: Use the Become a Tiger registration link on this page to submit your player
    information. A Rawlings Tigers NOVA coach or program contact will follow up with
    the next steps.
- question: Who can attend tryouts?
  answer: Rawlings Tigers NOVA tryouts are open to players in the age groups currently
    listed on this page, depending on roster needs and available openings by season.
- question: How many sessions does my player need to attend?
  answer: Players only need to attend one open evaluation date. A player may attend
    a make-up session if they are unavailable, if a session is canceled due to weather,
    or if a coach requests a follow-up.
- question: What should players bring?
  answer: Players should bring a glove, bat, helmet, cleats or turf shoes, water bottle,
    and any position-specific gear they normally use. Catchers should bring catcher’s
    gear when available.
- question: What ages are eligible?
  answer: Eligible ages are shown in the current season age chart and may change with
    team availability and roster needs from one season to the next.
- question: How do I determine which age group my player falls into?
  answer: Use the player age chart in the Schedule Dates section to confirm the correct
    rising age group before registering. Age groups are based on the player’s birth
    date range for the listed season.
- question: Where are Rawlings Tigers NOVA travel baseball tryouts held?
  answer: Tryout locations may vary by age group and session. Rawlings Tigers NOVA
    serves players across Northern Virginia, including Woodbridge, Dumfries, Montclair,
    Dale City, Stafford, Manassas, Fairfax, Prince William County, and nearby communities.
- question: What age groups does Rawlings Tigers NOVA offer travel baseball tryouts
    for?
  answer: Rawlings Tigers NOVA offers travel baseball tryouts for the age groups listed
    for the current season. Available groups may change as teams and roster needs are
    finalized.
- question: What makes Rawlings Tigers NOVA different from other Northern Virginia
    travel baseball teams?
  answer: The program emphasizes structured player development, professional coaching,
    competitive schedules, baseball IQ, accountability, effort, attitude, and team
    culture. Players are evaluated on both skill and readiness to compete in a team-first
    environment.
- question: Are private tryouts available?
  answer: Private tryouts may be available by request when roster needs and coaching
    availability allow. If your player cannot attend the posted dates, contact Rawlings
    Tigers NOVA so a coach can review availability.
- question: What if I can’t attend the posted dates?
  answer: Private tryouts or make-up evaluations may be available upon request. Availability
    depends on roster needs, field space, and coaching schedules.
- question: How will I know if I made the team?
  answer: Players are typically contacted by email within a few days of their tryout.
    Coaches will provide next-step details for roster invitations, follow-up sessions,
    or additional evaluation needs.
- question: What is the expected team commitment?
  answer: Team schedules vary by age group and season. Travel baseball includes recurring
    practices, games, and selected tournaments. Coaches share the team-specific practice
    frequency, tournament plan, and attendance expectations before a family accepts a
    roster spot.
- question: How far do teams travel for games and tournaments?
  answer: Regular training is based in Northern Virginia. Game and tournament locations
    vary by team and season, and may include local and regional events. Coaches review
    the expected travel plan with families before the season begins.
- question: What costs should families expect?
  answer: Program fees and inclusions can vary by age group, season, and tournament plan.
    Families receive team-specific information covering program fees, uniforms, indoor
    training, tournament charges, and expected travel expenses before accepting a roster
    spot.
- question: How are player roles and playing time handled?
  answer: Player roles and playing time can vary by age group, roster, position, level
    of competition, and event. Coaches communicate development priorities and team
    expectations so families can understand the approach before the season.
- question: What happens after a player receives a roster offer?
  answer: The coach shares team placement, seasonal expectations, fees, uniform needs,
    and the next registration steps. Families should review those details and ask any
    remaining questions before accepting the roster spot.
